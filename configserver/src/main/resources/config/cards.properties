spring.application.name=cards
<!-- Here -->

server.port=9000

# Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update

build.version=1.0
# --->Here

# Eureka Service Discovery
eureka.instance.preferIpAddress=false
eureka.instance.hostname=cards
eureka.client.fetchRegistry=true
eureka.client.registerWithEureka=true
eureka.client.serviceUrl.defaultZone=http://eurekaserver:8070/eureka/
eureka.client.registry-fetch-interval-seconds=5

# Spring Cloud LoadBalancer
spring.cloud.loadbalancer.enabled=true
spring.cloud.loadbalancer.ribbon.enabled=false
spring.cloud.loadbalancer.cache.enabled=false

# Springboot profiles

spring.config.import=cards-qa.properties,cards-prod.properties
#spring.profiles.active=qa


cards.message=Welcome to EazyBank accounts related local APIs
cards.contactDetails.name=John Doe - Developer
cards.contactDetails.email=john@eazybank.com
